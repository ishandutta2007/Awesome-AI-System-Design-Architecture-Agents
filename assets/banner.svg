<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beamFade {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.85; }
      }

      .pulse-orb1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .pulse-orb2 {
        animation: pulseGlow 9s ease-in-out infinite 2s;
        transform-origin: 1000px 320px;
      }
      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatDelay 7s ease-in-out infinite;
      }
      .data-flow {
        stroke-dasharray: 6 6;
        animation: dashAnim 2s linear infinite;
      }
      .pulse-beam {
        animation: beamFade 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Animated Glowing Orbs (Kept behind foreground) -->
  <circle class="pulse-orb1" cx="200" cy="100" r="160" fill="url(#glowGrad1)" />
  <circle class="pulse-orb2" cx="1020" cy="300" r="190" fill="url(#glowGrad2)" />

  <!-- Architecture Topology Flow in Background (Behind Text) -->
  <g opacity="0.45">
    <!-- Connecting Architecture Lines -->
    <path class="data-flow" d="M 120 70 L 320 70 L 320 120" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="data-flow" d="M 880 70 L 1080 70 L 1080 140" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="data-flow" d="M 100 360 L 300 360 L 380 320" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <path class="data-flow" d="M 820 320 L 920 360 L 1100 360" fill="none" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Top Left Node -->
    <rect class="floating-node-1" x="70" y="50" width="110" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <text class="floating-node-1" x="125" y="74" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LLM Agent</text>

    <!-- Top Right Node -->
    <rect class="floating-node-2" x="1020" y="50" width="120" height="38" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
    <text class="floating-node-2" x="1080" y="74" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">C4 Engine</text>

    <!-- Bottom Left Node -->
    <rect class="floating-node-2" x="60" y="340" width="120" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
    <text class="floating-node-2" x="120" y="364" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">IaC Topology</text>

    <!-- Bottom Right Node -->
    <rect class="floating-node-1" x="1020" y="340" width="130" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <text class="floating-node-1" x="1085" y="364" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diagram-as-Code</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Unobscured & Crystal Clear) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 110)">
      <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="-165" cy="0" r="5" fill="#38bdf8" class="pulse-beam" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        AI SYSTEM DESIGN &amp; ARCHITECTURE AGENTS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#glow)">
      Awesome AI System Design
    </text>

    <!-- Subtitle -->
    <text x="600" y="242" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      Curated Ecosystem of Architecture Agents, Diagram-as-Code &amp; Cloud Topologies
    </text>

    <!-- Category Feature Pills Row (Foreground, bottom) -->
    <g transform="translate(600, 295)">
      <!-- Pill 1: C4 Model -->
      <g transform="translate(-360, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏛️ C4 Models</text>
      </g>

      <!-- Pill 2: Diagram-as-Code -->
      <g transform="translate(-180, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">📐 Diagram-as-Code</text>
      </g>

      <!-- Pill 3: Autonomous Agents -->
      <g transform="translate(20, 0)">
        <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 AI Design Agents</text>
      </g>

      <!-- Pill 4: Cloud Topologies -->
      <g transform="translate(210, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ Cloud Topologies</text>
      </g>

      <!-- Pill 5: MCP Protocols -->
      <g transform="translate(375, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔌 MCP Ready</text>
      </g>
    </g>

    <!-- Bottom decorative border line -->
    <path d="M 350 350 L 850 350" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
